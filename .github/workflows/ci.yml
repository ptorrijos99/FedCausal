name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      # mypy needs no flwr: pyproject tells it to ignore those imports, which
      # keeps this job independent of Flower's own dependency pins.
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev,flower]"
      # Not "-m not slow": the transport-equivalence test is the strongest
      # correctness claim here and runs without Ray, so it must not be
      # deselected. bigdata needs networks that are not shipped.
      - run: pytest -m "not bigdata" --tb=short

  accel:
    name: numba fast path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # The JIT path is byte-identical to the pure-Python one by design, and
      # nothing else in CI would notice if that stopped being true.
      - run: pip install -e ".[dev,accel]"
      - run: pytest tests/search -m "not bigdata" --tb=short

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[flower]"
      # The gallery build runs these too, but as plain scripts they must
      # also work for anyone who clones the repo and just runs one.
      - run: python examples/01_learn_structure.py
      - run: python examples/02_fedges_inprocess.py
      - run: python examples/03_fedrcd.py
      - run: python examples/04_fusion_operators.py
      - run: python examples/05_your_own_data.py
      - run: python benchmarks/pgm26/benchmark.py --mode main --quick --out /tmp/pgm26.jsonl
      # The README points people at this app, so a wiring mistake in it should
      # be a red build rather than something they discover.
      - run: python -c "import fedcausal_site.app"
        working-directory: flower_app

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[docs]"
      # -W turns warnings into errors: a broken cross-reference or a docstring
      # that does not parse should fail here rather than ship as a wrong page.
      # The gallery executes every example, so this also runs them.
      - run: sphinx-build -b html -W --keep-going docs docs/_build/html
      # Belt and braces: the Actions-based Pages pipeline does not run Jekyll,
      # but without this a switch to branch-based publishing would silently
      # drop every `_static/` and `_modules/` path.
      - run: touch docs/_build/html/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  # Publishing is its own job so that a pull request still builds the docs
  # without being able to deploy them.
  publish-docs:
    needs: docs
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
