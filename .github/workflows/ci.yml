name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, so a dependency release that breaks the suite shows up without a
  # push to trigger it.
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      # mypy needs no flwr: pyproject tells it to ignore those imports, which
      # keeps this job independent of Flower's own dependency pins.
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev,flower]"
      # Not "-m not slow": the transport-equivalence test is the strongest
      # correctness claim here and runs without Ray, so it must not be
      # deselected. bigdata needs networks that are not shipped.
      - run: pytest -m "not bigdata" --tb=short

  accel:
    name: search with numba and causal-learn
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      # The numba path must agree with the pure-Python one, and GES must not
      # fall behind causal-learn's; nothing else in CI installs either.
      - run: pip install -e ".[dev,accel,compare]"
      - run: pytest tests/search -m "not bigdata" --tb=short

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[flower]"
      - run: python examples/01_learn_structure.py
      - run: python examples/02_fedges_inprocess.py
      - run: python examples/03_fedrcd.py
      # The README points people at this app, so a wiring mistake in it should
      # be a red build rather than something they discover.
      - run: python -c "import fedcausal_site.app"
        working-directory: examples/flower_app

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
