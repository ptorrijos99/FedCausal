name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, so a dependency release that breaks the suite shows up without a
  # push to trigger it.
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      # mypy needs no flwr: pyproject tells it to ignore those imports, which
      # keeps this job independent of Flower's own dependency pins.
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev,federated]"
      - run: pytest --tb=short

  # The oldest dependencies pyproject.toml allows, and no extras: the core and
  # the in-process FedGES and FedRCD must work without Flower, and the lower
  # bounds must be true. The Flower tests skip themselves without flwr.
  minimum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - run: >-
          pip install -e .
          "numba==0.59.*" "numpy==1.24.*" "pandas==2.0.*" "typing_extensions==4.0.*"
          "pytest>=8" "hypothesis>=6"
      - run: python -c "import importlib.util as u, sys; sys.exit(u.find_spec('flwr') is not None)"
      - run: pytest --tb=short

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[federated]"
      - run: python examples/02_federated_structure.py
      - run: python examples/03_fedrcd.py
      # The README points people at this app, so a wiring mistake in it should
      # be a red build rather than something they discover.
      - run: python -c "import fedcausal_site.app"
        working-directory: flower_app

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      # flower too, or the API page of fedcausal.flower cannot import it.
      - run: pip install -e ".[docs,federated]"
      # Builds the gallery too, so an example that stops running fails here.
      - run: sphinx-build -b html docs docs/_build/html

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
