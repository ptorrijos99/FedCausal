[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fedcausal-site"
version = "0.1.0"
description = "A deployable FedGES federation over fedcausal"
requires-python = ">=3.10"
dependencies = ["fedcausal[flower]>=0.1.0"]

[tool.hatch.build.targets.wheel]
packages = ["fedcausal_site"]

[tool.flwr.app]
publisher = "example"

[tool.flwr.app.components]
serverapp = "fedcausal_site.app:app_server"
clientapp = "fedcausal_site.app:app_client"

[tool.flwr.app.config]
# How many sites take part, how many variables they share, and how many rounds
# to run. num-variables must match the columns in every site's CSV.
num-clients = 3
num-variables = 8
num-server-rounds = 20
# Leave unset to require every site each round. Set it to tolerate dropouts.
# min-clients = 2

[tool.flwr.federations]
default = "remote"

# Point this at your SuperLink. Each SuperNode supplies its own data-path
# through --node-config when it starts; see README.md.
[tool.flwr.federations.remote]
address = "127.0.0.1:9093"
insecure = true
