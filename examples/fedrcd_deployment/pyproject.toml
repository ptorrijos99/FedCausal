[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fedrcd-site"
version = "0.1.0"
description = "A deployable FedRCD federation over fedcausal"
requires-python = ">=3.10"
dependencies = ["fedcausal[flower]>=0.1.0"]

[tool.hatch.build.targets.wheel]
packages = ["fedrcd_site"]

[tool.flwr.app]
publisher = "example"

[tool.flwr.app.components]
serverapp = "fedrcd_site.app:app_server"
clientapp = "fedrcd_site.app:app_client"

[tool.flwr.app.config]
# How many sites take part and which solver runs on the aggregated statistics.
# "fedrcd" is the default one-shot solver; "fedrcd_noniterative", "ishc_beta",
# "fedishc", and "fedhc" are its one-shot siblings, and "fedrcd_exact" is the
# multi-round protocol that runs p - 1 communication rounds instead of one.
num-clients = 3
solver = "fedrcd"
result-path = "rcd_result.json"
# Leave unset to require every site each round. Set it to tolerate dropouts.
# min-clients = 2

[tool.flwr.federations]
default = "remote"

# Point this at your SuperLink. Each SuperNode supplies its own data-path
# through --node-config when it starts; see README.md.
[tool.flwr.federations.remote]
address = "127.0.0.1:9093"
insecure = true
