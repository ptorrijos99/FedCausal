[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fedcausal-site"
version = "1.0.0"
description = "A fedcausal federation, in simulation or across real machines"
requires-python = ">=3.10"
dependencies = ["fedcausal[federated]>=1.0"]

[tool.hatch.build.targets.wheel]
packages = ["fedcausal_site"]

[tool.flwr.app]
publisher = "example"

[tool.flwr.app.components]
serverapp = "fedcausal_site.app:app_server"
clientapp = "fedcausal_site.app:app_client"

[tool.flwr.app.config]
# "fedges" learns a Bayesian network structure from discrete data; "fedrcd"
# recovers a causal order and coefficient matrix from continuous data.
algorithm = "fedges"
num-clients = 3
# Where the server writes the result, as JSON: the global DAG's edges for FedGES,
# the causal order and coefficient matrix for FedRCD.
result-path = "result.json"
# FedGES only. How many build/fuse rounds.
num-server-rounds = 5
# FedRCD only, as in fedcausal.FedRCD. "deflation", "ratio" and "sort" need one
# round of communication; "exact" runs p - 1 rounds instead. With order = 3,
# "ratio" is FedISHC and "sort" FedHC.
method = "deflation"
order = 4
# Leave unset to require every site each round. Set it to tolerate dropouts.
# min-clients = 2

[tool.flwr.federations]
default = "local-simulation"

# Every site in one process, on synthetic data. Needs Flower's Ray-based
# engine: pip install "fedcausal[federated-simulation]"
[tool.flwr.federations.local-simulation]
options.num-supernodes = 3

# Real supernodes, each reading its own CSV. Point the address at your
# SuperLink; each site supplies its own data-path at startup. See README.md.
[tool.flwr.federations.remote]
address = "127.0.0.1:9093"
insecure = true
