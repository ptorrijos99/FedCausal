[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fedcausal"
# Read from `fedcausal.__version__`, so the package and its metadata cannot
# disagree about which version this is.
dynamic = ["version"]
description = "Federated causal structure learning for Bayesian networks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pablo Torrijos Arenas" }]
keywords = [
  "causal discovery",
  "structure learning",
  "bayesian networks",
  "federated learning",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  # Pure-Python, dependency-free shim: supplies `typing.Self` on Python 3.10,
  # where it isn't in the stdlib yet.
  "typing_extensions>=4.0",
]

[project.urls]
Homepage = "https://github.com/ptorrijos99/fedcausal"
Documentation = "https://ptorrijos99.github.io/fedcausal/"
Issues = "https://github.com/ptorrijos99/fedcausal/issues"
Changelog = "https://github.com/ptorrijos99/fedcausal/blob/main/CHANGELOG.md"

[project.optional-dependencies]
accel = ["numba>=0.59"]
dev = [
  "pytest>=8",
  "pytest-cov",
  "hypothesis>=6",
  # Pinned: the formatter's output changes between minor releases, so an
  # unpinned range turns a ruff upgrade into a red build nobody asked for.
  "ruff>=0.16,<0.17",
  "mypy>=1.10,<3",
  "pandas-stubs>=2.0",
  "pre-commit",
]
compare = ["causal-learn>=0.1.3"]
docs = [
  "sphinx>=7",
  "pydata-sphinx-theme>=0.15",
  "numpydoc>=1.6",
  "sphinx-gallery>=0.15",
  "myst-parser>=2",
  "sphinx-copybutton>=0.5",
]
# The transport itself. Deployment against a SuperLink needs nothing more.
flower = ["flwr>=1.23"]
# Flower's simulation engine runs on Ray, which has no wheel for every Python
# version and platform, so it is a separate extra rather than a hard cost of
# using the transport.
flower-simulation = ["flwr[simulation]>=1.23"]
# Experiment-only. The fedcausal.lingam algorithms need none of these; the
# published comparisons do.
lingam-experiments = ["lingam>=1.8", "bnlearn>=0.7", "matplotlib>=3.7", "seaborn>=0.13", "tqdm>=4.62"]

[tool.hatch.version]
path = "src/fedcausal/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fedcausal"]
# The bundled networks under `datasets/data/` are package data, not source, so
# they need naming explicitly or the wheel ships loaders with nothing to load.
artifacts = ["src/fedcausal/datasets/data/*.xbif", "src/fedcausal/datasets/data/*.csv.gz"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY", "SIM", "D"]
ignore = ["D105", "D107"]
pydocstyle.convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
# Gallery scripts. Their module docstring is the rendered page's title and
# intro, so it is reStructuredText with an underline rather than a one-line
# summary, and sphinx-gallery requires the imports to sit in the cell that
# introduces them rather than all at the top.
"examples/**" = ["D", "E402"]
# Embeds the Markdown it generates, which is deliberately not hard-wrapped.
"benchmarks/build_docs.py" = ["E501"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
# SciPy ships no type stubs (scipy-stubs is incomplete and not a dependency).
module = ["scipy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# causal-learn (optional `compare` extra, tests/search/test_causallearn_crosscheck.py
# only) ships no type stubs and is not itself type-checked by `mypy src`, but is
# scoped here in case mypy is ever pointed at the test suite too.
module = ["causallearn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# flwr is an optional extra, so type checking must not require it to be
# installed. Its app decorators are untyped, which under `strict` would make
# every handler they wrap untyped too.
module = ["flwr.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# numba is the optional `accel` extra, and the lint job deliberately installs
# neither it nor flwr, so type checking must not depend on either being there.
module = ["numba.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["fedcausal.flower.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: long-running tests (deselect with '-m \"not slow\"')",
  "regression: tests pinning behaviour against committed reference outputs",
  "bigdata: needs large networks not shipped with the package; set FEDCAUSAL_NETWORKS",
]

# The Flower app lives in flower_app/, with its own pyproject: `flwr run
# flower_app`. A library has no business shipping a `[tool.flwr]`
# block of its own.
